name: New Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  codename: "Echo"
  version: "0.10.0"

jobs:
  build-macos:
    name: Create macOS ARM Release
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install fpm
        run: |
          brew install gnu-tar
          gem install fpm
          gem install package_cloud

      - name: Run Build Multi
        run: zig build --build-file build_multi.zig

      - name: Build WASM
        run: zig build wasm

      - name: Run Package Man
        run: python3 pkgman.py

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python3 -c "import re; data = open('build.zig.zon').read(); match = re.search(r'\.version\s*=\s*\"([\d.]+)\"', data); print(match.group(1) if match else 'unknown')")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare release artifacts
        run: |
          chmod +x scripts/prepare_release_artifacts.sh
          ./scripts/prepare_release_artifacts.sh ${{ steps.get_version.outputs.VERSION }}

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{secrets.SECRET}}
          tag_name: v${{env.version}}
          name: v${{env.version}} ${{env.codename}} Release
          body: |
            🚀 **MufiZ ${{env.version}} "${{env.codename}}" Release**

            🔧 Built with Zig 0.15.2
            🍎 **Platform: macOS ARM (Apple Silicon M1/M2/M3/M4)**

            ### 📦 Included Artifacts

            - **macOS Packages**: `.zip` archives for macOS ARM
            - **C Library** (`mufiz-c-library-*.zip`): **macOS ARM dynamic library (`.dylib`) + headers**
              - ✅ **macOS ARM native** - Built on Apple Silicon, includes `libmufiz.dylib` (ARM64)
              - Optimized for M1/M2/M3/M4 Macs
              - ⚠️ Intel Mac/Linux/Windows users: Build from source with `zig build`
            - **WebAssembly** (`mufiz-wasm-*.zip`): Platform-independent WASM binary (works everywhere)
            - **Documentation**: `ARTIFACTS.md` with checksums and installation instructions

            ### 🔨 Building C Library for Other Platforms

            **Intel Mac**:
            ```bash
            git clone https://github.com/Mustafif/MufiZ
            cd MufiZ
            zig build
            # Output: zig-out/lib/libmufiz.dylib (x86_64)
            ```

            **Linux**:
            ```bash
            git clone https://github.com/Mustafif/MufiZ
            cd MufiZ
            zig build
            # Output: zig-out/lib/libmufiz.so
            ```

            **Windows**:
            ```bash
            git clone https://github.com/Mustafif/MufiZ
            cd MufiZ
            zig build
            # Output: zig-out/lib/libmufiz.dll
            ```

            See `ARTIFACTS.md` for detailed installation and usage instructions.
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            pkg/*.zip
            pkg/*.deb
            pkg/*.rpm
            pkg/ARTIFACTS.md
      - name: Upload deb and rpm to packagecloud
        run: ./upload.sh -u ${{env.version}}
