<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MufiZ WASM Test</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f0f0; }
        h1 { color: #333; }
        #container { display: flex; width: 90%; max-width: 1200px; gap: 2rem; }
        .panel { flex: 1; display: flex; flex-direction: column; }
        textarea { width: 100%; height: 400px; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 5px; font-family: monospace; font-size: 14px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; align-self: flex-start; }
        button:disabled { background-color: #aaa; }
        pre { background-color: #fff; padding: 1rem; border: 1px solid #ccc; border-radius: 5px; width: 100%; height: 400px; overflow-y: auto; font-family: monospace; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>MufiZ WASM Runner</h1>
    <div id="container">
        <div class="panel">
            <h3>MufiZ Code</h3>
            <textarea id="codeInput" placeholder="Enter MufiZ code here...">print("Hello from MufiZ!");</textarea>
            <button id="runButton">Loading WASM...</button>
        </div>
        <div class="panel">
            <h3>Console Output</h3>
            <pre id="output"></pre>
        </div>
    </div>

    <!-- This script is generated by Emscripten during the build -->
    <!-- Make sure the path is correct relative to your HTML file -->
    <script src="./zig-out/lib/mufiz.js"></script>

    <script>
        const codeInput = document.getElementById('codeInput');
        const runButton = document.getElementById('runButton');
        const output = document.getElementById('output');

        // The Emscripten-generated mufiz.js creates a global `Module` object.
        // We can define properties on it *before* it loads to configure its behavior.
        var Module = {
            // 1. This is called before the WASM is loaded
            preRun: function() {
                console.log('MufiZ preRun: setting up...');
                runButton.disabled = true;
            },

            // 2. This is called when the WASM is loaded and ready
            onRuntimeInitialized: function() {
                console.log('MufiZ runtime initialized.');
                runButton.disabled = false;
                runButton.textContent = 'Run';

                // 3. We use cwrap to create easy-to-use JS wrappers for our exported C functions
                const init_wasm = Module.cwrap('init_wasm', null, []);
                const interpret = Module.cwrap('interpret', 'number', ['string']);

                // 4. Initialize the MufiZ library inside the WASM module
                init_wasm();

                runButton.addEventListener('click', () => {
                    const code = codeInput.value;
                    // The 'interpret' function returns a number (the exit code)
                    const exitCode = interpret(code);
                    console.log(`MufiZ exited with code: ${exitCode}`);
                });
            },

            // 5. This is where stdout from the WASM module will be redirected
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                output.textContent += text + "\n";
            },

            // This is for stderr
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                output.textContent += "ERROR: " + text + "\n";
            },
        };

    </script>
</body>
</html>
