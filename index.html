<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MufiZ WASM Playground</title>
        <style>
            :root {
                --primary: #00bcd4;
                --bg: #0a0a0a;
                --surface: #1a1a1a;
                --text: #e0e0e0;
                --code-bg: #000;
                --border: #333;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                margin: 0;
                padding: 20px;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border);
                padding-bottom: 15px;
                margin-bottom: 20px;
            }
            h1 {
                margin: 0;
                font-size: 24px;
                letter-spacing: -0.5px;
                color: var(--primary);
                font-weight: 700;
            }
            h1 span {
                font-weight: 300;
                color: #666;
            }
            .layout {
                display: flex;
                flex: 1;
                gap: 20px;
                min-height: 0;
            }
            .panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
                background: var(--surface);
                border-radius: 12px;
                border: 1px solid var(--border);
                overflow: hidden;
            }
            .panel-header {
                padding: 12px 15px;
                background: #222;
                border-bottom: 1px solid var(--border);
                font-size: 13px;
                font-weight: 600;
                color: #888;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            textarea {
                flex: 1;
                background: transparent;
                color: #80cbc4;
                border: none;
                padding: 15px;
                font-family:
                    "Fira Code", "JetBrains Mono", "Consolas", monospace;
                font-size: 14px;
                outline: none;
                resize: none;
                line-height: 1.6;
                tab-size: 4;
            }
            .footer {
                margin-top: 15px;
                display: flex;
                align-items: center;
                gap: 15px;
            }
            button {
                background: var(--primary);
                color: #000;
                border: none;
                padding: 12px 28px;
                border-radius: 6px;
                font-weight: 700;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.2s;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            button:hover:not(:disabled) {
                background: #26c6da;
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(0, 188, 212, 0.3);
            }
            button:disabled {
                background: #333;
                color: #666;
                cursor: not-allowed;
                transform: none;
            }
            #output {
                flex: 1;
                background: var(--code-bg);
                color: #9ccc65;
                padding: 15px;
                overflow-y: auto;
                font-family:
                    "Fira Code", "JetBrains Mono", "Consolas", monospace;
                font-size: 13px;
                white-space: pre-wrap;
                line-height: 1.5;
            }
            .status-pill {
                padding: 5px 14px;
                border-radius: 20px;
                font-size: 11px;
                background: #222;
                color: #aaa;
                border: 1px solid #333;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .status-pill.ready {
                color: #4caf50;
                border-color: #2e7d32;
                background: rgba(76, 175, 80, 0.1);
            }
            .status-pill.error {
                color: #f44336;
                border-color: #c62828;
                background: rgba(244, 67, 54, 0.1);
            }
            .info {
                font-size: 12px;
                color: #666;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>MufiZ <span>Playground</span></h1>
            <div id="status" class="status-pill">Initializing...</div>
        </header>
        <div class="layout">
            <div class="panel">
                <div class="panel-header">Editor</div>
                <textarea
                    id="codeInput"
                    spellcheck="false"
                    placeholder="Write your MufiZ code here..."
                >
// Welcome to MufiZ WASM Playground
// Numbers work perfectly in WASM!

print(42);
print(100 + 23);
print(999);

// Math operations
var x = 10;
var y = 5;
var sum = x + y;
var product = x * y;
var difference = x - y;

print(sum);
print(product);
print(difference);

// Loops
var i = 1;
while (i <= 5) {
    print(i);
    i = i + 1;
}

// Note: String printing has a known issue in WASM
// Numbers work great though!
}</textarea
                >
            </div>
            <div class="panel">
                <div class="panel-header">Console Output</div>
                <div id="output"></div>
            </div>
        </div>
        <div class="footer">
            <button id="runBtn" disabled>Loading WASM...</button>
            <span class="info"
                >MufiZ v0.11 • WebAssembly Runtime • Note: String literals have
                a known issue in WASM, numbers work perfectly</span
            >
        </div>

        <script>
            let wasmInstance = null;
            const statusEl = document.getElementById("status");
            const outputEl = document.getElementById("output");
            const runBtn = document.getElementById("runBtn");
            const codeInput = document.getElementById("codeInput");

            function setStatus(msg, type = "") {
                statusEl.innerText = msg;
                statusEl.className = "status-pill " + type;
            }

            function log(msg, isError = false) {
                const color = isError ? "#f44336" : "#9ccc65";
                outputEl.innerHTML += `<span style="color:${color}">${escapeHtml(msg)}</span>\n`;
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            async function initWasm() {
                try {
                    setStatus("Fetching WASM binary...");

                    const response = await fetch("zig-out/wasm/mufiz.wasm");
                    if (!response.ok) {
                        throw new Error(
                            `Failed to fetch WASM: ${response.status} ${response.statusText}`,
                        );
                    }

                    const wasmBytes = await response.arrayBuffer();
                    setStatus("Compiling WASM module...");

                    // WASI imports
                    const imports = {
                        wasi_snapshot_preview1: {
                            fd_write: (fd, iovs, iovs_len, nwritten) => {
                                if (!wasmInstance) return 0;

                                const view = new DataView(
                                    wasmInstance.exports.memory.buffer,
                                );
                                let totalWritten = 0;

                                for (let i = 0; i < iovs_len; i++) {
                                    const ptr = view.getUint32(
                                        iovs + i * 8,
                                        true,
                                    );
                                    const len = view.getUint32(
                                        iovs + i * 8 + 4,
                                        true,
                                    );

                                    const buffer = new Uint8Array(
                                        wasmInstance.exports.memory.buffer,
                                        ptr,
                                        len,
                                    );

                                    const text = new TextDecoder().decode(
                                        buffer,
                                    );
                                    outputEl.textContent += text;
                                    totalWritten += len;
                                }

                                view.setUint32(nwritten, totalWritten, true);
                                return 0;
                            },

                            fd_read: () => 0,
                            fd_close: () => 0,
                            fd_seek: () => 0,
                            fd_fdstat_get: () => 0,
                            fd_fdstat_set_flags: () => 0,
                            fd_prestat_get: () => 8,
                            fd_prestat_dir_name: () => 0,
                            path_open: () => 8,

                            proc_exit: (code) => {
                                console.log(
                                    `WASM process exited with code: ${code}`,
                                );
                            },

                            environ_get: () => 0,
                            environ_sizes_get: (environc, environ_buf_size) => {
                                if (!wasmInstance) return 0;
                                const view = new DataView(
                                    wasmInstance.exports.memory.buffer,
                                );
                                view.setUint32(environc, 0, true);
                                view.setUint32(environ_buf_size, 0, true);
                                return 0;
                            },

                            random_get: (buf, buf_len) => {
                                if (!wasmInstance) return 0;
                                const buffer = new Uint8Array(
                                    wasmInstance.exports.memory.buffer,
                                    buf,
                                    buf_len,
                                );
                                crypto.getRandomValues(buffer);
                                return 0;
                            },

                            clock_time_get: (clock_id, precision, time_ptr) => {
                                if (!wasmInstance) return 0;
                                const view = new DataView(
                                    wasmInstance.exports.memory.buffer,
                                );
                                const now = BigInt(Date.now()) * 1000000n;
                                view.setBigUint64(time_ptr, now, true);
                                return 0;
                            },

                            fd_filestat_get: () => 0,
                            fd_pwrite: () => 0,
                        },
                    };

                    setStatus("Instantiating module...");
                    const result = await WebAssembly.instantiate(
                        wasmBytes,
                        imports,
                    );
                    wasmInstance = result.instance;

                    // Check exports
                    const exp = wasmInstance.exports;
                    console.log("WASM Exports:", Object.keys(exp));

                    // Initialize MufiZ runtime
                    setStatus("Initializing MufiZ runtime...");

                    if (exp.mufiz_init) {
                        const initResult = exp.mufiz_init(0, 0, 0);
                        if (initResult !== 0) {
                            throw new Error(
                                `MufiZ init failed with code: ${initResult}`,
                            );
                        }
                    } else if (exp.init_wasm) {
                        exp.init_wasm();
                    } else {
                        throw new Error("No initialization function found");
                    }

                    setStatus("Ready", "ready");
                    runBtn.disabled = false;
                    runBtn.textContent = "Run Code";

                    log(
                        "✓ MufiZ WASM runtime initialized successfully\n",
                        false,
                    );
                } catch (error) {
                    setStatus("Error", "error");
                    log(`Initialization error: ${error.message}`, true);
                    console.error("WASM initialization error:", error);
                }
            }

            runBtn.addEventListener("click", async () => {
                if (!wasmInstance) {
                    log("Error: WASM not initialized", true);
                    return;
                }

                outputEl.textContent = "";

                try {
                    const code = codeInput.value;
                    const exp = wasmInstance.exports;

                    // Find the interpret function
                    const interpretFn = exp.mufiz_interpret || exp.interpret;
                    if (!interpretFn) {
                        throw new Error(
                            "No interpret function found in WASM exports",
                        );
                    }

                    // Encode the source code with null terminator
                    const sourceWithNull = code + "\0";
                    const encoder = new TextEncoder();
                    const encoded = encoder.encode(sourceWithNull);

                    // Allocate memory for the source code
                    // Use a safe offset in WASM memory (after heap base)
                    const memoryOffset = 65536; // 64KB offset

                    const memory = new Uint8Array(exp.memory.buffer);

                    // Check if we have enough memory
                    if (memoryOffset + encoded.length > memory.length) {
                        throw new Error(
                            `Source code too large: ${encoded.length} bytes (available: ${memory.length - memoryOffset})`,
                        );
                    }

                    // Copy source code to WASM memory
                    memory.set(encoded, memoryOffset);

                    // Execute the code
                    const exitCode = interpretFn(memoryOffset);

                    if (exitCode !== 0) {
                        log(`\n[Program exited with code: ${exitCode}]`, true);
                    } else {
                        log("\n[Program completed successfully]", false);
                    }
                } catch (error) {
                    log(`\nExecution error: ${error.message}`, true);
                    console.error("Execution error:", error);
                }
            });

            // Initialize on page load
            initWasm();
        </script>
    </body>
</html>
